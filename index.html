<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DataCafe|Laboratorio</title>
  <meta name="description" content="Seguimiento de café en post-cosecha: inventario, catación, trilla y ventas. Funciona sin internet.">
  <meta name="theme-color" content="#2F5D3A">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
  <script>
    // Aplica tema y tamaño de letra antes de pintar, para evitar parpadeos.
    (function () {
      try {
        var tema = localStorage.getItem('dc-tema') || 'auto';
        var escala = localStorage.getItem('dc-escala') || '1';
        if (tema !== 'auto') document.documentElement.setAttribute('data-theme', tema);
        document.documentElement.style.setProperty('--scale', escala);
      } catch (e) {}
    })();
  </script>
</head>
